name: 网易云签到

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 14,22 * * *"
  workflow_dispatch:
  watch:
    types: [started]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only allow a watch event from the repository owner to trigger a run.
    if: github.event_name != 'watch' || github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run check-in
        shell: bash
        env:
          WYY_USERS: ${{ secrets.USER }}
          WYY_PASSWORDS: ${{ secrets.PWD }}
          WYY_COOKIES: ${{ secrets.COOKIE }}
        run: |
          set -euo pipefail

          if [[ -z "${WYY_USERS:-}" || -z "${WYY_PASSWORDS:-}" ]]; then
            echo "请配置 USER 和 PWD Secrets"
            exit 1
          fi

          IFS='#' read -r -a users <<< "$WYY_USERS"
          IFS='#' read -r -a passwords <<< "$WYY_PASSWORDS"
          cookies=()
          if [[ -n "${WYY_COOKIES:-}" ]]; then
            IFS='#' read -r -a cookies <<< "$WYY_COOKIES"
            if [[ "${#cookies[@]}" -ne "${#users[@]}" ]]; then
              echo "COOKIE 设置后，Cookie 数量必须与 USER 一致"
              exit 1
            fi
          fi
          if [[ "${#users[@]}" -ne "${#passwords[@]}" ]]; then
            echo "USER 和 PWD 中的账号数量不一致"
            exit 1
          fi

          for ((i = 0; i < ${#users[@]}; i++)); do
            cookie=""
            if [[ "${#cookies[@]}" -gt 0 ]]; then cookie="${cookies[i]}"; fi
            printf '%s\n%s\n%s\n' "${users[i]}" "${passwords[i]}" "$cookie" | python checkin.py
          done
